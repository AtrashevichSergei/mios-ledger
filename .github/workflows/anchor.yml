# Каждые 6 часов: машина GitHub скачивает журнал, сверяет со всеми прошлыми якорями и дописывает новый.
# Расхождение роняет прогон — красный значок в истории Actions виден всем.
name: anchor
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 verify.py --anchor
      - run: |
          git config user.name "anchor-bot"
          git config user.email "anchor-bot@users.noreply.github.com"
          git add anchors.jsonl
          git diff --cached --quiet || git commit -m "anchor $(tail -1 anchors.jsonl)" && git push
